[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2,<2",
    "anthropic>=0.68,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
packages = [
    "mcp_agent_benchmark", "contact_index", "agents", "harness", "eval",
    "ledger", "scheduler", "configloader", "batch", "cache", "templating",
    "pricing", "notes", "shipping", "deps",
]

[tool.setuptools.package-dir]
mcp_agent_benchmark = "src/mcp_agent_benchmark"
contact_index = "src/contact_index"
ledger = "src/ledger"
scheduler = "src/scheduler"
configloader = "src/configloader"
batch = "src/batch"
cache = "src/cache"
templating = "src/templating"
pricing = "src/pricing"
notes = "src/notes"
shipping = "src/shipping"
deps = "src/deps"

[tool.pytest.ini_options]
pythonpath = ["src"]
# `runs/` contains ephemeral per-episode workspaces created by
# `harness/workspace.py`. Each workspace is itself a Git repository
# with its own tests/, so pytest must not recurse into runs/ when
# testing the benchmark repository.
norecursedirs = ["runs", ".venv", ".git"]